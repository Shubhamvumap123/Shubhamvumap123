
# GitHub Action for generating a contribution graph with a snake eating your contributions.

name: Generate Snake

permissions:
  contents: write

# Controls when the action will run. This action runs every 6 hours.

on:
  schedule:
      # every 6 hours
    - cron: "0 */6 * * *"

# This command allows us to run the Action automatically from the Actions tab.
  workflow_dispatch:

# Security: Restrict permissions to minimum required (contents: write for pushing changes)
permissions:
  contents: write

# The sequence of runs in this workflow:
jobs:
  # This workflow contains a single job called "build"
  build:
    permissions:
      contents: write # Required to push the generated snake animation to the output branch
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push to the output branch

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:

    # Checks repo under $GITHUB_WORKSHOP, so your job can access it
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

    # Generates the snake  
      - uses: Platane/snk@e2cedf76a2c05b25d09a6428ded69727b497a700 # v3
        id: snake-gif
        with:
          github_user_name: Shubhamvumap123
          # these next 2 lines generate the files on a branch called "output". This keeps the main branch from cluttering up.
          outputs: |
            dist/github-contribution-grid-snake.gif
            dist/github-contribution-grid-snake.svg

     # show the status of the build. Makes it easier for debugging (if there's any issues).
      - run: git status

      # Push the changes
      - name: Push changes
        uses: ad-m/github-push-action@4cc74773234f74829a8c21bc4d69dd4be9cfa599 # master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: master
          force: true

      # ⚡ Bolt: Upgraded to v4.0.0 to utilize faster Node 20 runtime and avoid deprecation warnings
      - uses: crazy-max/ghaction-github-pages@v4.0.0
        with:
          # the output branch we mentioned above
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
